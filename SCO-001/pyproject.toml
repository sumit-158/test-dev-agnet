[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sco-001-pir-sl-chat"
version = "0.1.0"
description = "SCO-001 PIR / Source List chat extraction PoC (Databricks App)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.9",
    "databricks-sdk>=0.40,<1",
    "databricks-sql-connector>=3.4,<4",
    "openai>=1.50,<2",
    "mlflow[databricks]>=3.1,<4",
    "pypdfium2>=4.30,<5",
    "pdfplumber>=0.11,<1",
    "Pillow>=10,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
markers = ["integration"]
testpaths = ["tests"]
