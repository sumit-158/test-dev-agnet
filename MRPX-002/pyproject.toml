[project]
name = "mrpx-002-shortage-rebalancing"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn==0.32.0",
    "pydantic==2.9.2",
    "databricks-sql-connector==3.6.0",
    "databricks-sdk==0.38.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "httpx==0.27.2", "ruff==0.7.3"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
